# The daemon's own unit is not in this repository — it is hand-written, because what it has
# to carry (the display environment, graphical-session.target, the venv path) is this
# machine's business and not the project's. This drop-in owns two directives of it and
# nothing else, because those two decide whether the case the dead-man's switch exists to
# catch can happen at all (issue #53).
#
# The unit restarts on failure ten seconds later. That is right, and it is why `kill -9` is
# not a failure the switch can see: the heartbeat resumes long before [health]
# max_age_seconds and the lock is retaken before the timer's next run. The failure left for
# the switch is systemd giving up — and with the defaults it never does. StartLimitBurst=5
# counts starts inside StartLimitIntervalSec=10s, so a restart every ten seconds never puts
# two starts in one window: a daemon that cannot start is retried forever, and nothing ever
# reports it dead.
#
# Five failures inside five minutes is a daemon that cannot start rather than one that
# crashed once. Then systemd stops, the unit goes to failed, the lock stays released, and
# the health timer says DIED on its next run — within five minutes, from the lock alone.
#
#   cp -r systemd/robot-army.service.d ~/.config/systemd/user/
#   systemctl --user daemon-reload
[Unit]
StartLimitIntervalSec=5min
StartLimitBurst=5
