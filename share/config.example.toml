# robot-army configuration.
#
# Generated by `robot-army example-config`. Every key the loader accepts is here;
# the commented-out ones say why they are commented out. Copy this to
# ~/.config/robot-army/config.toml and edit the handful that are actually yours —
# [github] author first, then [paths] repo_root.
#
# As it stands this file polls nothing, notifies nobody and deletes nothing. Every
# outward-facing behaviour is off until you turn it on.

# Where things live. Only repo_root has to exist before the daemon will start:
# a missing clone root is refused at load, as one message rather than one per
# repository.
[paths]
repo_root = "~/GIT"  # where clones live; a repository's default location is <repo_root>/<name>
worktree_root = "~/worktrees"  # where per-issue worktrees are created
# state_dir = "~/.local/state/robot-army"  # database, logs and the heartbeat
#   (defaults to $XDG_STATE_HOME/robot-army; set only to move it)
# socket_dir = "~/.local/state/robot-army"  # the daemon's own control sockets
#   (defaults to $XDG_RUNTIME_DIR/robot-army; set only to move it)

# The issue source, and the one section you cannot leave alone: author is the
# security boundary — only issues opened by that login are ever dispatched — and
# there is deliberately no way to disable it.
#
# The token must be a *classic* personal access token with repo and project
# scope. Fine-grained tokens cannot read Projects v2.
[github]
author = "your-github-login"  # only this login's issues are dispatched; blank is a hard error
label = "robot-army"  # the label that marks an issue as work for us
token_env = "GITHUB_TOKEN"  # *name* of the variable holding the token, never the token
# token_file = "~/.config/robot-army/github-token"  # a mode-0600 file holding the token instead
#   (exactly one of token_env or token_file may be set, and the file must already exist at mode 0600)
include_owned = true  # poll every repository you own
extra_repos = []  # repositories to poll beyond those, as "owner/name"
timeout_seconds = 20  # per-request timeout
max_retries = 4  # retries per request, with backoff
api_base = "https://api.github.com"  # override for GitHub Enterprise

# How a session is launched. permission_mode is the one to think about: auto
# lets the session work unattended, which is the point, but it is also the
# setting that decides how much it can do without asking.
[worker]
permission_mode = "auto"  # acceptEdits, auto, bypassPermissions, manual, dontAsk or plan
model = ""  # model to pass to the worker; empty means its default
base_branch = "main"  # branch new work branches off
branch_prefix = "robot-army"  # prefix for the branches it creates
binary = "claude"  # the worker executable

# What runs next. project_ordering is on by default, so a repository with a
# cleanly resolvable project board starts taking its order from that board —
# and starts holding cards parked in other columns. Set it false per repository
# to opt out.
[dispatch]
order = "oldest-first"  # oldest-first or repo-priority
default_repo_max_sessions = 1  # sessions per repository unless its own section says otherwise
wait_for_merge = false  # wait for the previous issue to land before starting the next
project_ordering = true  # let a linked project board decide the order

# Loop timings and the global session cap. poll_seconds and reconcile_seconds
# must both be at least tick_seconds.
[daemon]
effect_level = "live"  # plan, local, no-remote or live — see the guide's setup page
tick_seconds = 5  # how often the main loop wakes
poll_seconds = 60  # how often GitHub is polled
reconcile_seconds = 60  # how often sessions are reconciled with reality
dispatching_max_age_seconds = 900  # how long an item may sit mid-dispatch before it is an anomaly
confirm_timeout_seconds = 45  # how long a confirmation prompt waits before giving up
max_concurrent_sessions = 2  # the global cap, across all repositories

# Whether a session dispatched into a Spec Kit repository is told so. On by
# default: adding a paragraph to a prompt is neither irreversible nor
# outward-facing. `robot-army repos` lists which repositories this affects.
[speckit]
enabled = true  # add the lifecycle block to prompts
# commands = { implement = "open a PR when the tests pass" }  # extra instruction per lifecycle command, added to the prompt
#   (no extra instruction by default, and a live one here would go into every prompt. Keys are specify, plan, tasks, implement; for anything longer than this, write it as a [speckit.commands] table instead)

# An optional intake board: cards become issues, which then need the GitHub
# label like any other issue.
#
# Commented out header and all, and that is the behaviour rather than tidiness.
# With no [trello] section there is nothing to build, so no board request is ever
# constructed. An empty board_id in a live section would poll nothing, forever.
# [trello]
# board_id = "your-board-id"  # the board to read; from its URL
#   (the whole section is off until you have a board)
# label = "AI-task"  # Trello's word for the tag marking a card as intake
#   (section off)
# in_progress_list = "In Progress"  # list a card is moved to once its issue exists
#   (section off)
# done_list = "Done"  # list a card is moved to when its issue closes
#   (section off)
# ignore_lists = ["Someday"]  # list names whose cards are not intake
#   (section off; empty by default, which ignores nothing)
# poll_seconds = 300  # how often the board is read; every poll is a real request
#   (section off)
# timeout_seconds = 20  # per-request timeout
#   (section off)
# max_retries = 4  # retries per request, with backoff
#   (section off)
# api_base = "https://api.trello.com/1"  # the API root
#   (section off)
# key_env = "TRELLO_KEY"  # *name* of the variable holding the API key
#   (section off; exactly one of key_env or key_file)
# key_file = "~/.config/robot-army/trello-key"  # a file holding the API key instead
#   (section off; exactly one of key_env or key_file)
# token_env = "TRELLO_TOKEN"  # *name* of the variable holding the API token
#   (section off; exactly one of token_env or token_file)
# token_file = "~/.config/robot-army/trello-token"  # a file holding the API token instead
#   (section off; exactly one of token_env or token_file)

# What is worth saying out loud. events is empty by default, so an unconfigured
# install makes no outbound request at all — an unknown event kind is refused at
# load rather than ignored, because an event you asked for and never receive is a
# channel that lies by omission.
[notifications]
events = []  # any of "dispatch", "completion", "failure", "needs_info"
max_per_cycle = 5  # bound on one burst, so a backlog cannot flood

# The second notification channel. Files only — there is no *_env twin, because
# nothing asked for one.
#
# Commented out for the reason [trello] is: with no section there is nothing to
# build, and a half-configured channel cannot exist rather than merely failing to
# send.
# [pushover]
# token_file = "~/.config/robot-army/pushover-token"  # file holding the application token
#   (both keys are required together; the section is off until both exist)
# user_key_file = "~/.config/robot-army/pushover-user-key"  # file holding the user key
#   (both keys are required together; the section is off until both exist)

# Whether closing an issue reclaims its worktree and branch. Off by default, and
# not out of caution: removing a worktree and deleting a branch are both
# irreversible, and irreversible things are not reachable by default.
# `robot-army cleanup` runs the same guards by hand whether this is on or off.
[cleanup]
on_issue_close = false  # reclaim the worktree and branch when the issue closes

# Preparation steps run in a new worktree before the session starts. A step is
# one of run, link or copy — link and copy are first-class rather than shell
# commands so they stay idempotent and readable.
#
# A repository's own post_create *replaces* these rather than extending them.
[hooks]
default_timeout_seconds = 300  # timeout for a step that sets none
# post_create = [{ run = "uv sync", timeout = 300 }, { link = ".env" }]  # steps every repository gets unless its own section says otherwise
#   (no shared steps by default; the table form is nicer for more than one)

# How a session's window is opened, and how it is found again. kitty appends its
# PID to listen_on, so the glob has to be a glob: a fixed path can only ever be
# stale after a restart.
[terminal]
binary = "kitty"  # the terminal executable
probe_timeout_seconds = 2  # how long to wait when probing a socket
# socket_glob = "/run/user/1000/mykitty-*"  # where kitty's control socket is looked for
#   (defaults to mykitty-* under $XDG_RUNTIME_DIR, resolved at startup; writing it out would pin this machine's UID. Pair it with `listen_on unix:${XDG_RUNTIME_DIR}/mykitty` in kitty.conf)

# `robot-army serve`. The bind address *is* the access policy — there is no
# login — so it is loopback until you deliberately widen it.
[web]
bind = "127.0.0.1"  # the address to listen on
port = 8420  # the port to listen on
refresh_seconds = 10  # how often a page refreshes itself

# When the heartbeat counts as stale. `robot-army health` exits 4 if it is.
[health]
max_age_seconds = 180  # heartbeat older than this is stale
webhook_url = ""  # optional URL pinged by `robot-army health --notify`

# Per-repository exceptions. You do not need one of these: onboarding a
# repository is enough, and everything below inherits from the sections above
# when it is absent.
#
# Commented out because it names a repository that does not exist — and because
# an unknown key *inside* [repos.*] is an error rather than a warning, so a typo
# here is a config that will not load rather than a setting that quietly does
# nothing.
# [repos."you/example-repo"]
# path = "~/GIT/example-repo"  # the clone, when it is not <repo_root>/<name>
#   (must be an existing git repository; absent means derive it)
# base_branch = "develop"  # overrides [worker] base_branch here
#   (section off)
# permission_mode = "acceptEdits"  # overrides [worker] permission_mode here
#   (section off)
# model = "opus"  # overrides [worker] model here
#   (section off)
# max_sessions = 2  # sessions at once in this repository; capped by the global limit
#   (section off)
# priority = 10  # higher runs first under repo-priority ordering
#   (section off)
# wait_for_merge = true  # wait for the previous issue to land, here specifically
#   (section off; absent inherits [dispatch] wait_for_merge)
# project_ordering = false  # opt this repository out of board ordering
#   (section off; absent inherits [dispatch] project_ordering)
# project = 3  # which project governs: a number, or a projects/N URL
#   (section off; absent means discover the linked project)
# project_column = "Ready"  # the column to dispatch from
#   (section off; absent recognises Ready, Todo or To do)
# speckit = false  # tell sessions here about the Spec Kit lifecycle, or not
#   (section off; absent inherits [speckit] enabled)
# speckit_commands = { implement = "" }  # per-command instructions here; empty string drops one
#   (section off. Unlike the global table an empty value is meaningful here: it means no instruction for that command in this repository)
# post_create = [{ run = "make dev", timeout = 600 }]  # preparation steps, replacing [hooks] post_create entirely
#   (section off; these replace the shared steps rather than extending them)
# env = { DATABASE_URL = "postgres://localhost/dev" }  # environment variables for sessions in this repository
#   (section off; the table form is nicer for more than one)
